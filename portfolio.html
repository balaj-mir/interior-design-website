<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — BrightNest Interiors</title>
  <meta name="description" content="Explore BrightNest Interiors' portfolio of residential and commercial interior design projects. From modern living rooms to creative offices, see our work.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main>
    <!-- Page Header -->
    <section class="page-header">
      <div class="container">
        <h1>Our Portfolio</h1>
        <p>A curated selection of our favorite projects, from cozy residences to vibrant commercial spaces.</p>
        <div class="breadcrumb">
          <a href="index.html">Home</a>
          <span>/</span>
          <span>Portfolio</span>
        </div>
      </div>
    </section>

    <!-- Portfolio Gallery -->
    <section class="section">
      <div class="container">
        <div class="filter-bar" id="portfolioFilters">
          <!-- Populated by script.js -->
        </div>

        <div class="gallery-grid" id="portfolioGrid">
          <!-- Populated by script.js -->
        </div>
      </div>
    </section>

    <!-- CTA -->
    <section class="section" style="background:linear-gradient(135deg,var(--clr-primary-dark) 0%,var(--clr-primary) 100%);color:#fff;text-align:center;">
      <div class="container">
        <h2 style="color:#fff;margin-bottom:var(--sp-md);" class="animate-on-scroll">Love What You See?</h2>
        <p style="opacity:0.85;max-width:550px;margin:0 auto var(--sp-xl);font-size:var(--fs-md);" class="animate-on-scroll">Your space could be next. Let's discuss your vision and make it a reality.</p>
        <a href="contact.html" class="btn btn-accent animate-on-scroll">Start Your Project</a>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
</body>
</html>
