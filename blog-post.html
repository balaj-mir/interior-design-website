<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Post — BrightNest Interiors</title>
  <meta name="description" content="Read in-depth design articles, tips, and guides from the BrightNest Interiors blog.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main>
    <!-- Page Header -->
    <section class="page-header" style="padding-bottom:var(--sp-lg);">
      <div class="container">
        <div class="breadcrumb" style="margin-bottom:var(--sp-lg);">
          <a href="index.html">Home</a>
          <span>/</span>
          <a href="blog.html">Blog</a>
          <span>/</span>
          <span>Article</span>
        </div>
        <div class="post-header" id="postHeader">
          <!-- Populated by script.js -->
        </div>
      </div>
    </section>

    <!-- Post Body -->
    <section class="section">
      <div class="container">
        <div class="post-body" id="postBody">
          <!-- Populated by script.js -->
        </div>

        <!-- Not Found State -->
        <div id="postNotFound" style="display:none;text-align:center;padding:var(--sp-3xl);">
          <h2>Post Not Found</h2>
          <p style="color:var(--clr-text-muted);margin-bottom:var(--sp-xl);">Sorry, we couldn't find that article. It may have been moved or removed.</p>
          <a href="blog.html" class="btn btn-primary">Browse All Articles</a>
        </div>

        <!-- Back link -->
        <div class="post-body" style="margin-top:var(--sp-2xl);padding-top:var(--sp-xl);border-top:1px solid var(--clr-border);">
          <a href="blog.html" style="display:inline-flex;align-items:center;gap:var(--sp-sm);font-weight:600;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back to All Articles
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
</body>
</html>
