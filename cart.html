<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart — BrightNest Interiors</title>
  <meta name="description" content="Review items in your BrightNest Interiors shopping cart. Adjust quantities, remove items, and proceed to checkout.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main>
    <!-- Page Header -->
    <section class="page-header">
      <div class="container">
        <h1>Your Cart</h1>
        <p>Review your selections before checkout.</p>
        <div class="breadcrumb">
          <a href="index.html">Home</a>
          <span>/</span>
          <a href="shop.html">Shop</a>
          <span>/</span>
          <span>Cart</span>
        </div>
      </div>
    </section>

    <!-- Cart Section -->
    <section class="section">
      <div class="container" style="max-width:800px;">
        <!-- Empty State -->
        <div class="cart-empty" id="cartEmpty" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <h2>Your cart is empty</h2>
          <p style="color:var(--clr-text-muted);margin-bottom:var(--sp-xl);">Browse our curated collection and add something beautiful.</p>
          <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
        </div>

        <!-- Cart Items -->
        <div class="cart-table" id="cartItems">
          <!-- Populated by script.js -->
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary" id="cartSummary">
          <!-- Populated by script.js -->
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
</body>
</html>
